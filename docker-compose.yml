services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-chesslytics_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-chesslytics_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (32+ random characters) in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD (10+ characters) in .env}
      ADMIN_RESET_PASSWORD: ${ADMIN_RESET_PASSWORD:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUSTED_PROXY_HOPS: "1"
      SESSION_HOURS: ${SESSION_HOURS:-24}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      STOCKFISH_PATH: ${STOCKFISH_PATH:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      STOCKFISH_DEPTH: ${STOCKFISH_DEPTH:-12}
      STOCKFISH_TIME: ${STOCKFISH_TIME:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-8}
      MAX_GAMES_PER_UPLOAD: ${MAX_GAMES_PER_UPLOAD:-300}
      MAX_GAMES_PER_USER: ${MAX_GAMES_PER_USER:-1500}
      MAX_PLIES_PER_GAME: ${MAX_PLIES_PER_GAME:-600}
      MAX_ANALYSIS_DEPTH: ${MAX_ANALYSIS_DEPTH:-18}
      MAX_ANALYSIS_SECONDS: ${MAX_ANALYSIS_SECONDS:-2}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      MAX_QUEUED_JOBS: ${MAX_QUEUED_JOBS:-40}
      MAX_CONCURRENT_GRADING: ${MAX_CONCURRENT_GRADING:-2}
      COACH_DAILY_LIMIT: ${COACH_DAILY_LIMIT:-10}
      DAILY_PUZZLE_GOAL: ${DAILY_PUZZLE_GOAL:-5}
      IMPORT_MAX_MONTHS: ${IMPORT_MAX_MONTHS:-6}
      MAX_BACKUP_MB: ${MAX_BACKUP_MB:-32}
      FRONTEND_DIST: ${FRONTEND_DIST:-frontend/dist}
      ANALYSIS_DIR: ${ANALYSIS_DIR:-data/analysis}
      ANALYSIS_CACHE: ${ANALYSIS_CACHE:-}
      VERIFY_CACHE: ${VERIFY_CACHE:-}
      PARALLEL_WORKERS: ${PARALLEL_WORKERS:-1}
      VERIFY_WITH: ${VERIFY_WITH:-}
      BOOK_PATH: ${BOOK_PATH:-}
      PUZZLE_TOLERANCE: ${PUZZLE_TOLERANCE:-5.0}
      PUBLIC_URL: ${PUBLIC_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAILJET_API_KEY: ${MAILJET_API_KEY:-}
      MAILJET_SECRET_KEY: ${MAILJET_SECRET_KEY:-}
      SMTP2GO_API_KEY: ${SMTP2GO_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      PROFILES_KEPT_PER_USER: ${PROFILES_KEPT_PER_USER:-5}
      JOB_RETENTION_DAYS: ${JOB_RETENTION_DAYS:-14}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-300}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-15}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - internal
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - web

networks:
  internal:
    internal: true
  web:

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
