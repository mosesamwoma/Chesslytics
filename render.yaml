services:
  - type: web
    name: chesslytics
    runtime: docker
    plan: free            
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: STOCKFISH_DEPTH
        value: "12"
      - key: GROQ_API_KEY
        sync: false