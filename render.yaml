services:
  - type: web
    name: chesslytics
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_RESET_PASSWORD
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: SESSION_HOURS
        value: "24"
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: ENABLE_DOCS
        value: "false"
      - key: STOCKFISH_TIME
        value: ""
      - key: STOCKFISH_DEPTH
        value: "12"
      - key: MAX_UPLOAD_MB
        value: "8"
      - key: MAX_GAMES_PER_UPLOAD
        value: "300"
      - key: MAX_GAMES_PER_USER
        value: "1500"
      - key: MAX_PLIES_PER_GAME
        value: "600"
      - key: MAX_ANALYSIS_DEPTH
        value: "18"
      - key: MAX_ANALYSIS_SECONDS
        value: "2"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: MAX_QUEUED_JOBS
        value: "40"
      - key: MAX_CONCURRENT_GRADING
        value: "2"
      - key: COACH_DAILY_LIMIT
        value: "10"
      - key: DAILY_PUZZLE_GOAL
        value: "5"
      - key: IMPORT_MAX_MONTHS
        value: "6"
      - key: MAX_BACKUP_MB
        value: "32"
      - key: PARALLEL_WORKERS
        value: "1"
      - key: PUZZLE_TOLERANCE
        value: "5.0"
      - key: FRONTEND_DIST
        value: "/srv/frontend/dist"
      - key: ANALYSIS_DIR
        value: "/srv/data/analysis"
      - key: ANALYSIS_CACHE
        value: ""
      - key: VERIFY_CACHE
        value: ""
      - key: VERIFY_WITH
        value: ""
      - key: BOOK_PATH
        value: ""
      - key: PUBLIC_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURITY
        value: starttls
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0"
      - key: PROFILES_KEPT_PER_USER
        value: "5"
      - key: JOB_RETENTION_DAYS
        value: "14"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_POOL_RECYCLE
        value: "300"
      - key: DB_CONNECT_TIMEOUT
        value: "15"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
